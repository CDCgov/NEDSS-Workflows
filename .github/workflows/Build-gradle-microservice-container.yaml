name: Build and store a microservice container
on:
  workflow_call:
    inputs:
      # container build inputs
      microservice_name:
        description: "Name of microservice corresponding to a container in ECR."
        required: true
        type: string
      dockerfile_relative_path:
        description: "Relative path to dockerfile being built (use '-f' docker argument if the dockerfile referenced from the root directory)."
        required: true
        type: string
      environment_classifier:
        description: Metadata to append to application version. Ex. if version=1.0.0, and environment_classifier=SNAPSHOT result will be 1.0.0-SNAPSHOT.<githubsha>.
        required: true
        type: string
      java_version:
        description: Version of java which you are using to build you code.
        required: false
        default: '17'
        type: string
      # Container scanning inputs
      severity:
        description: 'Severities of vulnerabilities to be scanned for and displayed (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        required: false
        default: 'CRITICAL,HIGH,MEDIUM'
        type: string
      limit-severities-for-sarif:
        description: 'By default SARIF format enforces output of all vulnerabilities regardless of configured severities. To override this behavior set this parameter to true'
        required: false
        default: true
        type: boolean
      upload-to-github-security-tab:
        description: 'Upload results to GitHub security tab?'
        required: false
        default: true
        type: boolean
      ignore-unfixed:
        description: Ignore unpatched/unfixed vulnerabilities
        required: false
        default: false
        type: boolean
      skip-dirs:
        description: 'Comma separated list of directories where traversal is skipped'
        required: false
        default: ''
        type: string
      skip-files:
        description: 'Comma separated list of files where traversal is skipped'
        required: false
        default: ''
        type: string
      timeout:
        description: 'Scan timeout duration'
        required: false
        default: '10m0s'
        type: string
      exit-code:
        description: 'Exit code when specified vulnerabilities are found (0).'
        required: false
        default: '0'
        type: string
      trivyignores:
        description: 'Comma-separated list of relative paths in repository to one or more .trivyignore files, for usage see https://aquasecurity.github.io/trivy/v0.19.2/vulnerability/examples/filter/'
        required: false
        type: string
      # Octopus Deploy inputs
      create_octopus_release:
        description: "Create an Octopus Deploy release after successfully pushing to ECR. Even if false, it will still default to true on the main branch."
        required: false
        default: false
        type: boolean
      octopus_project:
        description: "Octopus Deploy project name to create a release for. Defaults to microservice_name if not provided."
        required: false
        type: string
      octopus_channel:
        description: "Octopus Deploy release channel."
        required: false
        default: 'alpha-main'
        type: string
      octopus_space:
        description: "Octopus Deploy space name."
        required: false
        default: 'Default'
        type: string
      octopus_server_url:
        description: "Octopus Deploy server URL."
        required: false
        default: 'https://octopus.skylightnbs.com'
        type: string
      octopus_api_key_secret_name:
        description: "Name or ARN of the AWS Secrets Manager secret holding the Octopus Deploy API key. Defaults to the AWS_OCTOPUS_API_KEY_ARN repo/org variable if not provided."
        required: false
        default: ''
        type: string
    secrets:
      NBS_ACCOUNTID:
        description: "AWS Account ID where ECR resides."
        required: false
      HARBOR_ROBOT_USERNAME:
        description: "Account name for the Harbor robot account assigned to GitHub Actions"
        required: true
      HARBOR_ROBOT_SECRET:
        description: "Unique authentication secret for the Harbor robot account assigned to GitHub Actions"
        required: true
      CDC_NBS_SANDBOX_SHARED_SERVICES_ACCOUNTID:
        description: "Backward compatible AWS Account ID where ECR resides."
        required: false
    outputs:
      output_image_tag:
        description: "Container image tag"
        value: ${{ jobs.build.outputs.output_image_tag }}
jobs:
  build:
    name: Build and store container
    runs-on: ubuntu-latest
    outputs:
      output_image_tag: ${{ steps.set-env-variables.outputs.output_image_tag }}

    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    # New comment
    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Gradle packages
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java_version }}
        cache: 'gradle'

    - name: Configure Environment Variables
      run: |
        github_sha_short=$(git rev-parse --short "$GITHUB_SHA")
        github_repo_name="$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)"
        github_tag=${GITHUB_REF#refs/tags/}
        echo "github_sha_short=$github_sha_short" >> $GITHUB_ENV
        echo "github_tag=$github_tag" >> $GITHUB_ENV
        echo "github_repo_name=$github_repo_name" >> $GITHUB_ENV

    - name: (Gradle) Create microservice version tag
      run: |
        app_version=$(./gradlew printVersion -PversionClassifier=${{inputs.environment_classifier}} | grep "Version:" | awk '{print $2}')
        new_image_tag=$app_version.${{env.github_sha_short}}
        echo "new_image_tag=$new_image_tag" >> $GITHUB_ENV
        echo "new_image_tag=$new_image_tag" >> $GITHUB_OUTPUT

    - name: Set image tag output
      id: set-env-variables
      run: echo "output_image_tag=${{ env.new_image_tag }}" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: "arn:aws:iam::${{ secrets.NBS_ACCOUNTID || secrets.CDC_NBS_SANDBOX_SHARED_SERVICES_ACCOUNTID }}:role/github-actions-nbs-deployment-role"
        role-session-name: deploy-infrastructure
        aws-region: us-east-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Log in to Harbor
      id: log-in-harbor
      uses: docker/login-action@v4
      with:
        registry: ${{ vars.harbor_url }}
        username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
        password: ${{ secrets.HARBOR_ROBOT_SECRET }}

    - name: Build and tag ${{ inputs.microservice_name }} image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.microservice_name }}
        HARBOR_REGISTRY: ${{ vars.harbor_url }}
        HARBOR_REPOSITORY: ${{ inputs.microservice_name }}
        IMAGE_TAG: "${{ env.new_image_tag }}"
      run: |
        # Build a docker container
        echo "Building image.." 

        TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $HARBOR_REGISTRY/$HARBOR_REPOSITORY:$IMAGE_TAG"

        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Main branch detected, adding latest tags"
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:latest $HARBOR_REGISTRY/$HARBOR_REPOSITORY:latest"
        fi

        docker build $TAGS ${{ inputs.dockerfile_relative_path}}
        echo "CONTAINER_TAG=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV    

    - name: Scan container image
      continue-on-error: false
      uses: CDCgov/NEDSS-Workflows/.github/actions/trivy-scanner@main
      with:
        container-ref: ${{ env.CONTAINER_TAG }}
        severity: ${{ inputs.severity }}
        upload-to-github-security-tab: ${{ inputs.upload-to-github-security-tab }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        skip-dirs: ${{ inputs.skip-dirs }}
        skip-files: ${{ inputs.skip-files }}
        exit-code: ${{ inputs.exit-code }}
        trivyignores: ${{ inputs.trivyignores }}
        limit-severities-for-sarif: ${{inputs.limit-severities-for-sarif}}

    - name: Push ${{ inputs.microservice_name }} image to Amazon ECR
      if: ${{ !cancelled() }}
      id: push-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.microservice_name }}
        IMAGE_TAG: "${{ env.new_image_tag }}"
      run: |
        echo "Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Push ${{ inputs.microservice_name }} image to Harbor
      if: ${{ !cancelled() }}
      id: push-image-harbor
      env:
        HARBOR_REGISTRY: ${{ vars.harbor_url }}
        HARBOR_REPOSITORY: ${{ inputs.microservice_name }}
        IMAGE_TAG: "${{ env.new_image_tag }}"
      run: |
        echo "Pushing image to Harbor..."
        docker push $HARBOR_REGISTRY/$HARBOR_REPOSITORY --all-tags
        echo "harbor_image=$HARBOR_REGISTRY/$HARBOR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
  
  create-octopus-release:
    name: Create Octopus Release
    needs: build
    if: ${{ (inputs.create_octopus_release == true || github.ref == 'refs/heads/main') && (inputs.octopus_api_key_secret_name != '' || vars.AWS_OCTOPUS_API_KEY_ARN != '') }}
    runs-on: ubuntu-latest
    steps:
    - name: Create Octopus Release
      uses: CDCgov/NEDSS-Workflows/.github/actions/octopus-release@main
      with:
        microservice_name: ${{ inputs.microservice_name }}
        octopus_project: ${{ inputs.octopus_project }}
        octopus_channel: ${{ inputs.octopus_channel }}
        octopus_space: ${{ inputs.octopus_space }}
        octopus_server_url: ${{ inputs.octopus_server_url }}
        octopus_api_key_secret_id: ${{ inputs.octopus_api_key_secret_name || vars.AWS_OCTOPUS_API_KEY_ARN }}
        release_number: ${{ needs.build.outputs.output_image_tag }}
        aws_account_id: ${{ secrets.NBS_ACCOUNTID || secrets.CDC_NBS_SANDBOX_SHARED_SERVICES_ACCOUNTID }}
