name: 'Create Octopus Release'
description: 'Consolidated logic for resolving mapping, retrieving API keys, and creating an Octopus Deploy release'
inputs:
  microservice_name:
    description: 'Name of the microservice'
    required: true
  octopus_project:
    description: 'Explicit Octopus project name (overrides mapping)'
    required: false
  octopus_channel:
    description: 'Octopus channel'
    required: false
    default: 'alpha-main'
  octopus_space:
    description: 'Octopus space'
    required: false
    default: 'Default'
  octopus_server_url:
    description: 'Octopus server URL'
    required: false
    default: 'https://octopus.skylightnbs.com'
  octopus_api_key_secret_id:
    description: 'AWS Secrets Manager Secret ID or ARN for the Octopus API key'
    required: true
  release_number:
    description: 'The release version/tag'
    required: true
  aws_account_id:
    description: 'AWS Account ID for assuming the deployment role'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout NEDSS-Workflows (for mapping)
      uses: actions/checkout@v6
      with:
        repository: CDCgov/NEDSS-Workflows
        path: workflows-repo
        ref: main

    - name: Resolve Octopus Project and Package
      id: resolve
      shell: bash
      run: |
        # This step reads the octopus-mapping.yaml file to determine the correct
        # Octopus project name and package ID based on the provided microservice name.
        # The file lives in the root of the NEDSS-Workflows repo
        MAPPING_FILE="workflows-repo/octopus-mapping.yaml"
        SERVICE_NAME="${{ inputs.microservice_name }}"

        # Use yq to check for existence directly
        EXISTS=$(yq ".mappings | has(\"$SERVICE_NAME\")" "$MAPPING_FILE")

        if [ "$EXISTS" != "true" ] && [ -z "${{ inputs.octopus_project }}" ]; then
          echo "Service $SERVICE_NAME not in mapping and no explicit project provided. Skipping release creation."
          echo "skip=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "skip=false" >> $GITHUB_OUTPUT

        # If exists, resolve, otherwise fall back to explicit or microservice name
        if [ "$EXISTS" == "true" ]; then
          # Determine if simple or complex mapping
          IS_COMPLEX=$(yq ".mappings.\"$SERVICE_NAME\" | type == \"!!map\"" "$MAPPING_FILE")

          if [ "$IS_COMPLEX" == "true" ]; then
            PROJECT_NAME=$(yq ".mappings.\"$SERVICE_NAME\".project" "$MAPPING_FILE" | tr -d '"')
            PACKAGE_ID=$(yq ".mappings.\"$SERVICE_NAME\".package" "$MAPPING_FILE" | tr -d '"')
          else
            PROJECT_NAME=$(yq ".mappings.\"$SERVICE_NAME\"" "$MAPPING_FILE" | tr -d '"')
            PACKAGE_ID="${{ inputs.microservice_name }}"
          fi
        else
          PROJECT_NAME="${{ inputs.octopus_project || inputs.microservice_name }}"
          PACKAGE_ID="${{ inputs.microservice_name }}"
        fi

        echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
        echo "package_id=$PACKAGE_ID" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: "arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-nbs-deployment-role"
        role-session-name: octopus-release
        aws-region: us-east-2

    - name: Retrieve Octopus API key from AWS Secrets Manager
      shell: bash
      run: |
        if [ "${{ steps.resolve.outputs.skip }}" == "true" ]; then
          exit 0
        fi
        secret=$(aws secretsmanager get-secret-value \
          --secret-id "${{ inputs.octopus_api_key_secret_id }}" \
          --query SecretString \
          --output text)
        echo "::add-mask::$secret"
        echo "OCTOPUS_API_KEY=$secret" >> $GITHUB_ENV

    - name: Create a release in Octopus Deploy
      if: steps.resolve.outputs.skip != 'true'
      uses: OctopusDeploy/create-release-action@v4
      env:
        OCTOPUS_API_KEY: ${{ env.OCTOPUS_API_KEY }}
        OCTOPUS_URL: ${{ inputs.octopus_server_url }}
        OCTOPUS_SPACE: ${{ inputs.octopus_space }}
      with:
        project: ${{ steps.resolve.outputs.project_name }}
        channel: ${{ inputs.octopus_channel }}
        release_number: ${{ inputs.release_number }}
        packages: "${{ steps.resolve.outputs.package_id }}:${{ inputs.release_number }}"
        ignore_existing: true
